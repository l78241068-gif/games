<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Steal An Egg Mobile</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #0a0a12; font-family: 'Segoe UI', sans-serif; user-select: none; touch-action: none; color: white; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; box-sizing: border-box; }
        #ui { font-size: 22px; font-weight: bold; text-shadow: 0 0 10px #00ffff; color: #00ffff; text-align: center; width: 100%; margin-top: 10px; }
        
        /* Злая птица/дракон */
        #boss-container { text-align: center; margin-top: 20px; }
        #boss-status { font-size: 24px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; transition: 0.2s; }
        .sleeping { color: #00ff00; text-shadow: 0 0 15px #00ff00; }
        .angry { color: #ff0055; text-shadow: 0 0 20px #ff0055; animation: shake 0.1s infinite; }
        @keyframes shake { 0% { transform: translateX(0); } 50% { transform: translateX(5px); } 100% { transform: translateX(-5px); } }
        #boss-avatar { font-size: 70px; margin-top: 10px; display: inline-block; }
        
        /* Гнездо с яйцами */
        #nest { font-size: 65px; margin: 20px 0; text-shadow: 0 0 20px rgba(255,255,255,0.3); position: relative; }
        
        /* Главная кнопка кражи (Внизу) */
        #steal-btn { width: 120px; height: 120px; background: linear-gradient(135deg, #00ffff, #0083b0); border: 3px solid #fff; border-radius: 50%; color: #0a0a12; font-size: 20px; font-weight: bold; box-shadow: 0 0 25px #00ffff; display: flex; justify-content: center; align-items: center; cursor: pointer; margin-bottom: 30px; -webkit-tap-highlight-color: transparent; }
        #steal-btn:active { transform: scale(0.92); box-shadow: 0 0 10px #00ffff; }
        
        /* Экраны состояний */
        .overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box; }
        .overlay h1 { font-size: 36px; margin-bottom: 15px; }
        #over-win h1 { color: #00ff00; text-shadow: 0 0 20px #00ff00; }
        #over-lose h1 { color: #ff0055; text-shadow: 0 0 20px #ff0055; }
        .restart-btn { background: #fff; color: #000; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">У ТЕБЯ ЯЙЦА: <span id="score">0</span> / 10</div>
    
    <div id="boss-container">
        <div id="boss-status" class="sleeping">💤 Птица Спит</div>
        <div id="boss-avatar">🐲</div>
    </div>
    
    <div id="nest">🪺</div>
    
    <div id="steal-btn">ТАЩИ!</div>
</div>

<!-- Экран Победы -->
<div id="over-win" class="overlay">
    <h1>ТЫ ПОБЕДИЛ! 🎉</h1>
    <p>Лёва — самый скрытный вор яиц! Ты незаметно утащил все 10 яиц!</p>
    <button class="restart-btn" onclick="resetGame()">ИГРАТЬ СНОВА</button>
</div>

<!-- Экран Поражения -->
<div id="over-lose" class="overlay">
    <h1>ПОПАЛСЯ! 💥</h1>
    <p>Птица проснулась и поймала тебя за руку! Попробуй ещё раз!</p>
    <button class="restart-btn" onclick="resetGame()">ПОВТОРИТЬ</button>
</div>

<script>
    let score = 0;
    const maxScore = 10;
    let isBossAngry = false;
    let gameActive = true;
    let bossTimer = null;
    let audioCtx = null;

    const statusText = document.getElementById('boss-status');
    const avatar = document.getElementById('boss-avatar');
    const scoreSpan = document.getElementById('score');
    const stealBtn = document.getElementById('steal-btn');

    // Генерация встроенных звуков
    function playSound(type) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'steal') {
            // Быстрый приятный писк при краже
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        } else if (type === 'catch') {
            // Жесткий низкий крик монстра при поимке
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }
    }

    // Рандомное переключение состояний птицы
    function loopBossBehavior() {
        if (!gameActive) return;
        
        let nextChange = Math.random() * 1500 + 800; // от 0.8 до 2.3 секунд
        
        bossTimer = setTimeout(() => {
            isBossAngry = !isBossAngry;
            
            if (isBossAngry) {
                statusText.innerText = "🚨 СМОТРИТ!";
                statusText.className = "angry";
                avatar.innerText = "🦖";
            } else {
                statusText.innerText = "💤 Птица Спит";
                statusText.className = "sleeping";
                avatar.innerText = "🐲";
            }
            
            loopBossBehavior();
        }, nextChange);
    }

    // Клик по кнопке «ТАЩИ!»
    stealBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!gameActive) return;

        if (isBossAngry) {
            // Если нажал в момент бодрствования — проиграл
            gameActive = false;
            clearTimeout(bossTimer);
            playSound('catch');
            document.getElementById('over-lose').style.display = 'flex';
        } else {
            // Успешно украл
            score++;
            scoreSpan.innerText = score;
            playSound('steal');
            
            if (score >= maxScore) {
                gameActive = false;
                clearTimeout(bossTimer);
                document.getElementById('over-win').style.display = 'flex';
            }
        }
    });

    function resetGame() {
        score = 0;
        scoreSpan.innerText = score;
        isBossAngry = false;
        gameActive = true;
        statusText.innerText = "💤 Птица Спит";
        statusText.className = "sleeping";
        avatar.innerText = "🐲";
        document.getElementById('over-win').style.display = 'none';
        document.getElementById('over-lose').style.display = 'none';
        clearTimeout(bossTimer);
        loopBossBehavior();
    }

    // Запуск цикла птицы
    loopBossBehavior();
</script>

</body>
</html>
