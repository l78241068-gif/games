<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Minecraft Mobile</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #74b9ff; font-family: sans-serif; user-select: none; touch-action: none; }
        #game-container { position: relative; background: #87CEEB; border: 4px solid #333; width: 100vw; height: 100vh; overflow: hidden; }
        .block { position: absolute; width: 40px; height: 40px; box-sizing: border-box; border: 1px solid rgba(0,0,0,0.1); }
        .grass { background: #55bc4b; border-top: 5px solid #7cfc00; }
        .dirt { background: #8b5a2b; }
        .stone { background: #808080; border: 2px solid #666; }
        #player { position: absolute; width: 30px; height: 50px; background: #ff4d6d; border: 2px solid #fff; border-radius: 5px; z-index: 10; }
        #blocks-layer { position: absolute; width: 100%; height: 100%; }
        
        /* Кнопки инвентаря сверху */
        #inventory { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); display: flex; background: rgba(0,0,0,0.6); padding: 5px; border-radius: 5px; z-index: 20; }
        .slot { width: 40px; height: 40px; margin: 0 5px; border: 2px solid #ccc; display: flex; justify-content: center; align-items: center; background: rgba(255,255,255,0.2); }
        .slot.active { border-color: #ff4d6d; background: rgba(255,255,255,0.4); }
        .slot-inner { width: 25px; height: 25px; }
        
        /* Сенсорный джойстик (Слева) */
        #joy-bound { position: absolute; bottom: 30px; left: 30px; width: 100px; height: 100px; background: rgba(255,255,255,0.15); border: 2px solid #fff; border-radius: 50%; z-index: 100; }
        #joy-stick { position: absolute; width: 40px; height: 40px; background: #fff; border-radius: 50%; top: 30px; left: 30px; }
        
        /* Кнопка прыжка (Справа) */
        #jump-btn { position: absolute; bottom: 40px; right: 30px; width: 80px; height: 80px; background: rgba(255,255,255,0.25); border: 2px solid #fff; border-radius: 50%; color: white; font-weight: bold; font-size: 16px; display: flex; justify-content: center; align-items: center; z-index: 100; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="inventory">
        <div class="slot active" id="slot-1" onclick="selectBlock('grass')"><div class="slot-inner grass"></div></div>
        <div class="slot" id="slot-2" onclick="selectBlock('dirt')"><div class="slot-inner dirt"></div></div>
        <div class="slot" id="slot-3" onclick="selectBlock('stone')"><div class="slot-inner stone"></div></div>
    </div>
    <div id="player"></div>
    <div id="blocks-layer"></div>
    
    <div id="joy-bound"><div id="joy-stick"></div></div>
    <div id="jump-btn">UP</div>
</div>

<script>
    const container = document.getElementById('game-container');
    const blocksLayer = document.getElementById('blocks-layer');
    const player = document.getElementById('player');
    const stick = document.getElementById('joy-stick');
    const bound = document.getElementById('joy-bound');

    const blockSize = 40, gridWidth = 25, gridHeight = 15;
    let playerX = 80, playerY = 240, playerVelocityY = 0, isJumping = false;
    let selectedBlockType = 'grass', moveDir = 0, world = {};

    function generateWorld() {
        blocksLayer.innerHTML = '';
        for (let x = 0; x < gridWidth; x++) {
            for (let y = 0; y < 5; y++) {
                let type = (y === 4) ? 'grass' : (y < 2 ? 'stone' : 'dirt');
                createBlock(x, y, type);
            }
        }
    }

    function createBlock(x, y, type) {
        const block = document.createElement('div');
        block.className = `block ${type}`;
        block.style.left = (x * blockSize) + 'px';
        block.style.bottom = (y * blockSize) + 'px';
        block.addEventListener('touchstart', (e) => {
            e.stopPropagation(); e.preventDefault();
            removeBlock(x, y);
        });
        blocksLayer.appendChild(block);
        world[`${x},${y}`] = { element: block, type: type };
    }

    function removeBlock(x, y) {
        if (world[`${x},${y}`]) {
            world[`${x},${y}`].element.remove();
            delete world[`${x},${y}`];
        }
    }

    container.addEventListener('touchstart', (e) => {
        if(e.touches.clientY > window.innerHeight - 150) return;
        const rect = container.getBoundingClientRect();
        const clickX = e.touches.clientX - rect.left;
        const clickY = rect.bottom - e.touches.clientY;
        const gridX = Math.floor(clickX / blockSize);
        const gridY = Math.floor(clickY / blockSize);
        if (gridX >= 0 && gridX < gridWidth && gridY >= 0 && gridY < gridHeight) {
            if (!world[`${gridX},${gridY}`]) createBlock(gridX, gridY, selectedBlockType);
        }
    });

    function selectBlock(type) {
        selectedBlockType = type;
        document.querySelectorAll('.slot').forEach(s => s.classList.remove('active'));
        if(type === 'grass') document.getElementById('slot-1').classList.add('active');
        if(type === 'dirt') document.getElementById('slot-2').classList.add('active');
        if(type === 'stone') document.getElementById('slot-3').classList.add('active');
    }

    // Логика джойстика
    bound.addEventListener('touchstart', handleJoy);
    bound.addEventListener('touchmove', handleJoy);
    bound.addEventListener('touchend', () => {
        stick.style.left = '30px'; moveDir = 0;
    });

    function handleJoy(e) {
        const rect = bound.getBoundingClientRect();
        let touchX = e.touches.clientX - rect.left - 50;
        touchX = Math.max(-30, Math.min(30, touchX));
        stick.style.left = (touchX + 30) + 'px';
        moveDir = touchX / 30; // Скорость от -1 до 1
    }

    // Кнопка прыжка
    document.getElementById('jump-btn').addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!isJumping) { playerVelocityY = 11; isJumping = true; }
    });

    function updatePlayer() {
        playerVelocityY -= 0.8;
        playerY += playerVelocityY;
        playerX += moveDir * 5;

        if (playerX < 0) playerX = 0;
        if (playerX > window.innerWidth - 30) playerX = window.innerWidth - 30;

        let currentGridX = Math.floor((playerX + 15) / blockSize);
        let currentGridY = Math.floor(playerY / blockSize);

        if (world[`${currentGridX},${currentGridY}`] || playerY <= 0) {
            playerY = (currentGridY + 1) * blockSize;
            if(playerY <= 0) playerY = 160;
            playerVelocityY = 0; isJumping = false;
        }
        player.style.left = playerX + 'px';
        player.style.bottom = playerY + 'px';
    }

    generateWorld();
    setInterval(updatePlayer, 30);
</script>

</body>
</html>
