<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Minecraft Mobile Fixed</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #74b9ff; font-family: sans-serif; user-select: none; touch-action: none; }
        #game-container { position: relative; background: #87CEEB; width: 100vw; height: 100vh; overflow: hidden; }
        .block { position: absolute; width: 40px; height: 40px; box-sizing: border-box; border: 1px solid rgba(0,0,0,0.1); }
        .grass { background: #55bc4b; border-top: 5px solid #7cfc00; }
        .dirt { background: #8b5a2b; }
        .stone { background: #808080; border: 2px solid #666; }
        #player { position: absolute; width: 30px; height: 50px; background: #ff4d6d; border: 2px solid #fff; border-radius: 5px; z-index: 10; }
        #blocks-layer { position: absolute; width: 100%; height: 100%; }
        
        /* Кнопки инвентаря сверху — СТРОЯТ БЛОК ПРИ НАЖАТИИ */
        #inventory { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); display: flex; background: rgba(0,0,0,0.6); padding: 5px; border-radius: 5px; z-index: 20; }
        .slot { width: 50px; height: 50px; margin: 0 5px; border: 2px solid #ccc; display: flex; justify-content: center; align-items: center; background: rgba(255,255,255,0.2); color: white; font-size: 10px; font-weight: bold; }
        .slot-inner { width: 30px; height: 30px; margin-bottom: 2px; }
        
        /* Кнопки ходьбы (Слева) */
        .ctrl-btn { position: absolute; bottom: 20px; background: rgba(0,0,0,0.6); color: #fff; font-size: 24px; font-weight: bold; border: 2px solid #fff; border-radius: 15px; display: flex; justify-content: center; align-items: center; z-index: 100; width: 75px; height: 75px; }
        #btn-left { left: 20px; }
        #btn-right { left: 110px; }
        
        /* Кнопка прыжка и удаления (Справа) */
        #btn-jump { right: 20px; background: rgba(0,255,0,0.4); border-color: #00ff00; }
        #btn-break { right: 110px; background: rgba(255,0,0,0.4); border-color: #ff0000; font-size: 16px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="inventory">
        <div class="slot" onclick="buildBlock('grass')"><div class="slot-inner grass"></div></div>
        <div class="slot" onclick="buildBlock('dirt')"><div class="slot-inner dirt"></div></div>
        <div class="slot" onclick="buildBlock('stone')"><div class="slot-inner stone"></div></div>
    </div>
    
    <div id="player"></div>
    <div id="blocks-layer"></div>
    
    <div id="btn-left" class="ctrl-btn">◀</div>
    <div id="btn-right" class="ctrl-btn">▶</div>
    <div id="btn-break" class="ctrl-btn">ЛОМАЙ</div>
    <div id="btn-jump" class="ctrl-btn">ВВЕРХ</div>
</div>

<script>
    const blocksLayer = document.getElementById('blocks-layer');
    const player = document.getElementById('player');

    const blockSize = 40;
    let playerX = 120, playerY = 200, playerVelocityY = 0, isJumping = false;
    let moveDir = 0, world = {};

    function generateWorld() {
        blocksLayer.innerHTML = '';
        for (let x = 0; x < 30; x++) {
            for (let y = 0; y < 4; y++) {
                let type = (y === 3) ? 'grass' : 'dirt';
                createBlock(x, y, type);
            }
        }
    }

    function createBlock(x, y, type) {
        const block = document.createElement('div');
        block.className = `block ${type}`;
        block.style.left = (x * blockSize) + 'px';
        block.style.bottom = (y * blockSize) + 'px';
        blocksLayer.appendChild(block);
        world[`${x},${y}`] = { element: block, type: type };
    }

    // Постройка блока прямо перед персонажем
    function buildBlock(type) {
        let pGridX = Math.floor((playerX + 15) / blockSize);
        let pGridY = Math.floor(playerY / blockSize) + 1;
        if (!world[`${pGridX},${pGridY}`]) {
            createBlock(pGridX, pGridY, type);
        }
    }

    // Удаление блока под ногами или перед персонажем
    document.getElementById('btn-break').addEventListener('touchstart', (e) => {
        e.preventDefault();
        let pGridX = Math.floor((playerX + 15) / blockSize);
        let pGridY = Math.floor(playerY / blockSize) - 1;
        if (world[`${pGridX},${pGridY}`]) {
            world[`${pGridX},${pGridY}`].element.remove();
            delete world[`${pGridX},${pGridY}`];
        }
    });

    // Ходьба по кнопкам
    document.getElementById('btn-left').addEventListener('touchstart', () => moveDir = -1);
    document.getElementById('btn-left').addEventListener('touchend', () => moveDir = 0);
    document.getElementById('btn-right').addEventListener('touchstart', () => moveDir = 1);
    document.getElementById('btn-right').addEventListener('touchend', () => moveDir = 0);

    // Прыжок
    document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!isJumping) { playerVelocityY = 12; isJumping = true; }
    });

    function updatePlayer() {
        playerVelocityY -= 0.8;
        playerY += playerVelocityY;
        playerX += moveDir * 6;

        if (playerX < 0) playerX = 0;

        let currentGridX = Math.floor((playerX + 15) / blockSize);
        let currentGridY = Math.floor(playerY / blockSize);

        if (world[`${currentGridX},${currentGridY}`] || playerY <= 0) {
            playerY = (currentGridY + 1) * blockSize;
            if(playerY <= 0) playerY = 160;
            playerVelocityY = 0; isJumping = false;
        }
        player.style.left = playerX + 'px';
        player.style.bottom = playerY + 'px';
    }

    generateWorld();
    setInterval(updatePlayer, 30);
</script>
</body>
</html>
