<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Cyber Snake Mobile</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #05050a; font-family: sans-serif; user-select: none; touch-action: none; color: #fff; }
        #game-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 10px; box-sizing: border-box; }
        #score { font-size: 28px; font-weight: bold; color: #00ffaa; text-shadow: 0 0 15px rgba(0,255,170,0.5); margin-top: 10px; margin-bottom: 10px; }
        canvas { background: #0c0c18; border: 2px solid #333; border-radius: 15px; box-shadow: 0 0 25px rgba(0,255,170,0.2); max-width: 100%; max-height: 75vh; }
        #hint { margin-top: 15px; font-size: 13px; color: #555; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        .overlay { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .restart-btn { background: #00ffaa; color: #000; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 12px; margin-top: 20px; box-shadow: 0 0 15px #00ffaa; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score">СЧЁТ: 0</div>
    <canvas id="snakeCanvas" width="340" height="440"></canvas>
    <div id="hint">Проводи пальцем по экрану в любую сторону для управления!</div>
</div>

<!-- Экран проигрыша -->
<div id="game-over" class="overlay">
    <h1 style="color:#ff0055; text-shadow: 0 0 15px #ff0055;">ИГРА ОКОНЧЕНА 💥</h1>
    <p id="final-score" style="font-size:22px; color: #00ffaa;"></p>
    <button class="restart-btn" onclick="resetGame()">ИГРАТЬ ЕЩЕ РАЗ</button>
</div>

<script>
    const canvas = document.getElementById("snakeCanvas");
    const ctx = canvas.getContext("2d");

    const grid = 20;
    let snake = [{x: 160, y: 160}, {x: 140, y: 160}];
    let apple = {x: 80, y: 80};
    let dx = grid, dy = 0;
    let score = 0, gameActive = true, gameSpeed = 130;
    let gameInterval = null;
    let audioCtx = null;

    function playTone(f) {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination); o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(0.08, audioCtx.currentTime); o.start(); o.stop(audioCtx.currentTime + 0.05);
    }

    function generateApple() {
        apple.x = Math.floor(Math.random() * (canvas.width / grid)) * grid;
        apple.y = Math.floor(Math.random() * (canvas.height / grid)) * grid;
        // Проверяем, чтобы еда не заспавнилась внутри змейки
        for (let cell of snake) {
            if (cell.x === apple.x && cell.y === apple.y) generateApple();
        }
    }

    // СВAЙПЫ НА ТЕЛЕФОНЕ (Управление без кнопок)
    let touchX = 0, touchY = 0;
    window.addEventListener('touchstart', (e) => {
        touchX = e.touches[0].clientX;
        touchY = e.touches[0].clientY;
    });

    window.addEventListener('touchmove', (e) => {
        if (!gameActive || !touchX || !touchY) return;
        e.preventDefault();

        let diffX = e.touches[0].clientX - touchX;
        let diffY = e.touches[0].clientY - touchY;

        // Определяем, куда был свайп: по горизонтали или вертикали
        if (Math.abs(diffX) > Math.abs(diffY)) {
            if (diffX > 30 && dx === 0) { dx = grid; dy = 0; } // Вправо
            else if (diffX < -30 && dx === 0) { dx = -grid; dy = 0; } // Влево
        } else {
            if (diffY > 30 && dy === 0) { dx = 0; dy = grid; } // Вниз
            else if (diffY < -30 && dy === 0) { dx = 0; dy = -grid; } // Вверх
        }
    }, { passive: false });

    function main() {
        if (!gameActive) return;

        // Движение головы змейки
        const head = {x: snake[0].x + dx, y: snake[0].y + dy};

        // Коллизия со стенами
        if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
            endGame(); return;
        }

        // Коллизия с собственным хвостом
        for (let cell of snake) {
            if (head.x === cell.x && head.y === cell.y) { endGame(); return; }
        }

        snake.unshift(head);

        // Змейка кушает сферу
        if (head.x === apple.x && head.y === apple.y) {
            score++;
            document.getElementById('score').innerText = "СЧЁТ: " + score;
            playTone(450 + score * 15);
            generateApple();
            // Немного ускоряем игру при росте счета
            if (gameSpeed > 70) {
                clearInterval(gameInterval);
                gameSpeed -= 2;
                gameInterval = setInterval(main, gameSpeed);
            }
        } else {
            snake.pop(); // Удаляем хвост, если ничего не съели
        }

        render();
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Рисуем светящуюся неоновую еду
        ctx.fillStyle = '#ff00ff';
        ctx.shadowBlur = 15; ctx.shadowColor = '#ff00ff';
        ctx.fillRect(apple.x + 2, apple.y + 2, grid - 4, grid - 4);

        // Рисуем змейку (голова ярче, хвост плавно переливается)
        blocksLayer = ctx.shadowBlur = 10; ctx.shadowColor = '#00ffaa';
        for (let i = 0; i < snake.length; i++) {
            ctx.fillStyle = i === 0 ? '#fff' : `hsl(${(140 + i * 4) % 360}, 100%, 50%)`;
            ctx.fillRect(snake[i].x + 1, snake[i].y + 1, grid - 2, grid - 2);
        }
        ctx.shadowBlur = 0; // Сбрасываем свечение для оптимизации
    }

    function endGame() {
        gameActive = false;
        playTone(150);
        document.getElementById('final-score').innerText = "Результат: " + score + " очков";
        document.getElementById('game-over').style.display = 'flex';
    }

    function resetGame() {
        snake = [{x: 160, y: 160}, {x: 140, y: 160}];
        dx = grid; dy = 0; score = 0; gameSpeed = 130; gameActive = true;
        document.getElementById('score').innerText = "СЧЁТ: 0";
        document.getElementById('game-over').style.display = 'none';
        generateApple();
        clearInterval(gameInterval);
        gameInterval = setInterval(main, gameSpeed);
    }

    generateApple();
    gameInterval = setInterval(main, gameSpeed);
</script>
</body>
</html>
