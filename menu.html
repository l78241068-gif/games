<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровой Хаб Макса</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #111119);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 500px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #00ffff;
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0,255,255,0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 16px;
        }
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .game-btn {
            display: block;
            text-decoration: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            color: #fff;
            transition: 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-transform: uppercase;
        }
        /* Стили для каждой кнопки */
        .btn-love {
            background: linear-gradient(90deg, #ff4d6d, #ff758f);
            border: 1px solid #ffb3c1;
        }
        .btn-love:hover {
            box-shadow: 0 0 15px #ff4d6d;
            transform: translateY(-2px);
        }
        .btn-mine {
            background: linear-gradient(90deg, #55bc4b, #7cfc00);
            color: #111;
            border: 1px solid #7cfc00;
        }
        .btn-mine:hover {
            box-shadow: 0 0 15px #7cfc00;
            transform: translateY(-2px);
        }
        .btn-cs {
            background: linear-gradient(90deg, #de9b35, #f68b1f);
            border: 1px solid #f68b1f;
        }
        .btn-cs:hover {
            box-shadow: 0 0 15px #f68b1f;
            transform: translateY(-2px);
        }
        .btn-race {
            background: linear-gradient(90deg, #00b4db, #0083b0);
            border: 1px solid #00b4db;
        }
        .btn-race:hover {
            box-shadow: 0 0 15px #00b4db;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Игры Макса</h1>
    <p>Выбери, во что хочешь поиграть на телефоне:</p>
    
    <div class="menu-grid">
        <!-- Ссылки ведут на файлы внутри твоей папки -->
        <a href="index.html" class="game-btn btn-love">❤️ Секрет для Насти</a>
        <a href="minecraft.html" class="game-btn btn-mine">🧱 Мини-Майнкрафт</a>
        <a href="cs2.html" class="game-btn btn-cs">🔫 Тренажер CS2</a>
        <a href="gonki.html" class="game-btn btn-race">🏎️ 3D Неон Гонки</a>
    </div>
</div>

</body>
</html>
