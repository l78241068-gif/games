<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Хаб Лёвы</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #12121c, #08080d);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            user-select: none;
        }
        .container {
            background: rgba(255, 255, 255, 0.03);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #00ffff;
            font-size: 26px;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(0,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            color: #888;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .game-btn {
            display: block;
            text-decoration: none;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            color: #fff;
            transition: 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-race {
            background: linear-gradient(90deg, #00b4db, #0083b0);
            border: 1px solid #00b4db;
        }
        .btn-race:hover {
            box-shadow: 0 0 20px #00b4db;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Проекты Лёвы</h1>
    <p>Выбери сайт для запуска:</p>
    
    <div class="menu-grid">
        <a href="gonki.html" class="game-btn btn-race">🏎️ 3D Неон Гонки</a>
    </div>
</div>

</body>
</html>
