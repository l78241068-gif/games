<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Cyber Clicker Mobile</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #080810; font-family: 'Segoe UI', sans-serif; user-select: none; touch-action: none; color: #fff; }
        #game-container { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 15px; box-sizing: border-box; }
        
        /* Баланс и доход */
        #header { text-align: center; margin-top: 10px; width: 100%; }
        #balance { font-size: 32px; font-weight: bold; color: #00ffcc; text-shadow: 0 0 15px rgba(0,255,204,0.4); }
        #cps-view { font-size: 14px; color: #888; margin-top: 5px; }
        
        /* Главная кнопка-чип для тапов */
        #click-core { width: 160px; height: 160px; background: linear-gradient(135deg, #00ffff, #ff00ff); border: 4px solid #fff; border-radius: 30px; display: flex; justify-content: center; align-items: center; font-size: 70px; box-shadow: 0 0 30px rgba(0,255,255,0.4); cursor: pointer; transition: transform 0.05s; -webkit-tap-highlight-color: transparent; margin: 20px 0; }
        #click-core:active { transform: scale(0.92); }
        
        /* Магазин апгрейдов */
        #shop { width: 100%; max-height: 45vh; overflow-y: auto; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 10px; box-sizing: border-box; margin-bottom: 10px; }
        .shop-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.04); padding: 12px; margin-bottom: 8px; border-radius: 10px; border: 1px solid rgba(0,255,255,0.1); }
        .item-info { display: flex; flex-direction: column; }
        .item-name { font-weight: bold; font-size: 15px; color: #fff; }
        .item-cost { font-size: 13px; color: #ff00ff; margin-top: 2px; }
        .buy-btn { background: #00ffcc; color: #000; border: none; padding: 8px 14px; font-weight: bold; border-radius: 8px; font-size: 13px; }
        .buy-btn:active { background: #00b38f; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="header">
        <div id="balance">0 $</div>
        <div id="cps-view">Доход: +0 $ / сек</div>
    </div>
    
    <div id="click-core">💾</div>
    
    <div id="shop">
        <div class="shop-item">
            <div class="item-info">
                <span class="item-name">⚡ Быстрый Клик (+1)</span>
                <span id="cost-click" class="item-cost">Цена: 15 $</span>
            </div>
            <button class="buy-btn" onclick="buyUpgrade('click')">КУПИТЬ</button>
        </div>
        <div class="shop-item">
            <div class="item-info">
                <span class="item-name">📟 Процессор ИИ (+1/сек)</span>
                <span id="cost-cpu" class="item-cost">Цена: 100 $</span>
            </div>
            <button class="buy-btn" onclick="buyUpgrade('cpu')">КУПИТЬ</button>
        </div>
        <div class="shop-item">
            <div class="item-info">
                <span class="item-name">🎴 Видеокарта RTX (+8/сек)</span>
                <span id="cost-gpu" class="item-cost">Цена: 500 $</span>
            </div>
            <button class="buy-btn" onclick="buyUpgrade('gpu')">КУПИТЬ</button>
        </div>
        <div class="shop-item">
            <div class="item-info">
                <span class="item-name">🌐 Серверная Станция (+50/сек)</span>
                <span id="cost-server" class="item-cost">Цена: 3000 $</span>
            </div>
            <button class="buy-btn" onclick="buyUpgrade('server')">КУПИТЬ</button>
        </div>
    </div>
</div>

<script>
    let money = 0;
    let clickPower = 1;
    let income = 0;
    let audioCtx = null;

    let costs = { click: 15, cpu: 100, gpu: 500, server: 3000 };

    function updateUI() {
        document.getElementById('balance').innerText = Math.floor(money) + " $";
        document.getElementById('cps-view').innerText = "Доход: +" + income + " $ / сек";
        document.getElementById('cost-click').innerText = "Цена: " + costs.click + " $";
        document.getElementById('cost-cpu').innerText = "Цена: " + costs.cpu + " $";
        document.getElementById('cost-gpu').innerText = "Цена: " + costs.gpu + " $";
        document.getElementById('cost-server').innerText = "Цена: " + costs.server + " $";
    }

    function playTone(freq, duration) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    // Клик по дискете
    document.getElementById('click-core').addEventListener('touchstart', (e) => {
        e.preventDefault();
        money += clickPower;
        playTone(600 + clickPower * 5, 0.04);
        updateUI();
    });

    // Покупка улучшений
    function buyUpgrade(type) {
        if (money >= costs[type]) {
            money -= costs[type];
            playTone(800, 0.1);
            
            if (type === 'click') {
                clickPower += 1;
                costs.click = Math.floor(costs.click * 1.5);
            } else if (type === 'cpu') {
                income += 1;
                costs.cpu = Math.floor(costs.cpu * 1.4);
            } else if (type === 'gpu') {
                income += 8;
                costs.gpu = Math.floor(costs.gpu * 1.4);
            } else if (type === 'server') {
                income += 50;
                costs.server = Math.floor(costs.server * 1.4);
            }
            updateUI();
        } else {
            playTone(150, 0.15); // Звук ошибки, если мало денег
        }
    }

    // Ежесекундный пассивный доход
    setInterval(() => {
        if (income > 0) {
            money += income;
            updateUI();
        }
    }, 1000);

    updateUI();
</script>

</body>
</html>
