<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>3D Mobile Racing</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #050508; font-family: 'Courier New', monospace; user-select: none; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 15px; left: 15px; color: #00ffff; font-size: 18px; pointer-events: none; text-shadow: 0 0 10px #00ffff; font-weight: bold; z-index: 10; }
        
        /* Кнопки управления на экране */
        .btn { position: absolute; bottom: 25px; background: rgba(0,0,0,0.6); color: #00ffff; border: 2px solid #00ffff; font-size: 24px; font-weight: bold; border-radius: 15px; display: flex; justify-content: center; align-items: center; z-index: 100; box-shadow: 0 0 10px #00ffff; }
        #btn-left { left: 25px; width: 75px; height: 75px; }
        #btn-right { left: 115px; width: 75px; height: 75px; }
        #btn-gas { right: 25px; width: 90px; height: 90px; background: rgba(255,0,255,0.4); border-color: #ff00ff; color: #ff00ff; box-shadow: 0 0 10px #ff00ff; }
    </style>
</head>
<body>

<div id="ui">
    СКОРОСТЬ: <span id="speed">0</span> КМ/Ч<br>
    ДИСТАНЦИЯ: <span id="distance">0</span> М
</div>

<!-- Сенсорные кнопки для пальцев -->
<div id="btn-left" class="btn">◀</div>
<div id="btn-right" class="btn">▶</div>
<div id="btn-gas" class="btn">ГАЗ</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    let gameActive = true, speed = 0, distance = 0, playerX = 0, trackPosition = 0;
    const maxSpeed = 250;

    const segmentLength = 200, rumblesPerSegment = 3;
    let segments = [], trackLength = 0;

    function generateTrack() {
        segments = [];
        for (let i = 0; i < 400; i++) {
            let curve = 0;
            if (i > 40 && i < 90) curve = 2;    
            if (i > 130 && i < 200) curve = -2.5;  
            if (i > 240 && i < 300) curve = 1.5; 
            segments.push({
                index: i,
                p1: { world: { z: i * segmentLength }, screen: { x: 0, y: 0, w: 0 } },
                p2: { world: { z: (i + 1) * segmentLength }, screen: { x: 0, y: 0, w: 0 } },
                curve: curve,
                color: Math.floor(i / rumblesPerSegment) % 2 ? 
                    { grass: '#051a05', road: '#1a1a24', rumble: '#00ffff' } : 
                    { grass: '#08080f', road: '#15151f', rumble: '#ff00ff' }
            });
        }
        trackLength = segments.length * segmentLength;
    }

    // Переменные нажатий кнопок
    let pressGas = false, pressLeft = false, pressRight = false;

    // Вешаем события касания пальцем для телефона
    document.getElementById('btn-gas').addEventListener('touchstart', () => pressGas = true);
    document.getElementById('btn-gas').addEventListener('touchend', () => pressGas = false);
    document.getElementById('btn-left').addEventListener('touchstart', () => pressLeft = true);
    document.getElementById('btn-left').addEventListener('touchend', () => pressLeft = false);
    document.getElementById('btn-right').addEventListener('touchstart', () => pressRight = true);
    document.getElementById('btn-right').addEventListener('touchend', () => pressRight = false);

    function project(point, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) {
        let tx = point.world.z - cameraZ;
        if (tx <= 0) return;
        let scale = cameraDepth / tx;
        point.screen.x = Math.round((width / 2) + (scale * (point.world.x - cameraX) * width / 2));
        point.screen.y = Math.round((height / 2) - (scale * (point.world.y - cameraY) * height / 2));
        point.screen.w = Math.round(scale * roadWidth * width / 2);
    }

    function gameLoop() {
        if (pressGas) speed += 2.5; else speed -= 1.5;
        if (speed > 0) {
            let turnSpeed = 0.04 * (speed / maxSpeed);
            if (pressLeft) playerX -= turnSpeed;
            if (pressRight) playerX += turnSpeed;
        }

        speed = Math.max(0, Math.min(speed, maxSpeed));
        trackPosition += speed * 2;
        distance += Math.round(speed / 12);

        if (trackPosition >= trackLength) trackPosition -= trackLength;

        document.getElementById("speed").innerText = Math.round(speed);
        document.getElementById("distance").innerText = distance;

        render();
        requestAnimationFrame(gameLoop);
    }

    function render() {
        ctx.fillStyle = "#050508"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        let width = canvas.width, height = canvas.height, roadWidth = 2000, cameraDepth = 0.84;
        let playerSegment = Math.floor(trackPosition / segmentLength);
        let baseSegment = segments[playerSegment % segments.length];
        let dx = -baseSegment.curve * ((trackPosition % segmentLength) / segmentLength), currentX = 0, maxy = height;

        for (let n = 0; n < 80; n++) {
            let segment = segments[(playerSegment + n) % segments.length];
            currentX += dx; dx += segment.curve;
            let camX = playerX * roadWidth - currentX, camY = 1500;
            let camZ = trackPosition - (segment.index < playerSegment ? trackLength : 0);

            segment.p1.world.x = 0; segment.p1.world.y = 0;
            segment.p2.world.x = 0; segment.p2.world.y = 0;
            project(segment.p1, camX, camY, camZ, cameraDepth, width, height, roadWidth);
            project(segment.p2, camX, camY, camZ, cameraDepth, width, height, roadWidth);

            if (segment.p1.screen.y >= maxy || segment.p1.screen.y < height / 2) continue;
            let p1 = segment.p1.screen, p2 = segment.p2.screen;

            ctx.fillStyle = segment.color.grass; ctx.fillRect(0, p2.y, width, p1.y - p2.y);
            let r1 = p1.w * 0.1, r2 = p2.w * 0.1;
            ctx.fillStyle = segment.color.rumble;
            ctx.beginPath(); ctx.moveTo(p1.x - p1.w - r1, p1.y); ctx.lineTo(p1.x - p1.w, p1.y); ctx.lineTo(p2.x - p2.w, p2.y); ctx.lineTo(p2.x - p2.w - r2, p2.y); ctx.fill();
            ctx.beginPath(); ctx.moveTo(p1.x + p1.w + r1, p1.y); ctx.lineTo(p1.x + p1.w, p1.y); ctx.lineTo(p2.x + p2.w, p2.y); ctx.lineTo(p2.x + p2.w - r2, p2.y); ctx.fill();
            ctx.fillStyle = segment.color.road;
            ctx.beginPath(); ctx.moveTo(p1.x - p1.w, p1.y); ctx.lineTo(p1.x + p1.w, p1.y); ctx.lineTo(p2.x + p2.w, p2.y); ctx.lineTo(p2.x - p2.w, p2.y); ctx.fill();
            maxy = p1.y;
        }

        if (speed > 0) playerX -= (speed / maxSpeed) * baseSegment.curve * 0.005;

        // Рисуем машину
        let carW = 150, carH = 65, carX = width / 2 - carW / 2, carY = height - 120;
        ctx.fillStyle = "#ff00ff"; ctx.fillRect(carX, carY, carW, carH);
        ctx.fillStyle = "#00ffff"; ctx.fillRect(carX + 15, carY - 20, carW - 30, 20);
        ctx.fillStyle = "#111"; ctx.fillRect(carX - 5, carY + carH - 25, 20, 35); ctx.fillRect(carX + carW - 15, carY + carH - 25, 20, 35);
    }

    generateTrack(); gameLoop();
</script>
</body>
</html>
