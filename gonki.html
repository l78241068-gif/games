<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Бесконечные Гонки</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #111; font-family: 'Courier New', monospace; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; color: #fff; font-size: 24px; pointer-events: none; text-shadow: 2px 2px #000; line-height: 1.5; font-weight: bold; z-index: 10; }
        .hud-red { color: #ff3333; }
        .hud-green { color: #00ff00; }
        #menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 100; cursor: pointer; }
        .menu-box { border: 3px solid #ff3333; padding: 30px; text-align: center; border-radius: 10px; background: #000; pointer-events: none; }
        .start-text { color: #ff3333; font-size: 24px; font-weight: bold; margin-top: 20px; animation: blink 1.5s infinite; text-transform: uppercase; }
        @keyframes blink { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    </style>
</head>
<body>

<div id="ui">
    СКОРОСТЬ: <span id="speed" class="hud-green">0</span> КМ/Ч<br>
    ДИСТАНЦИЯ: <span id="distance">0</span> М
</div>

<div id="menu" onclick="startGame()">
    <div class="menu-box">
        <h2>3D INF RACING</h2>
        <p><b>Управление:</b><br>
        • Стрелка <b>ВВЕРХ</b> / <b>W</b> — Газ (разгон)<br>
        • Стрелка <b>ВНИЗ</b> / <b>S</b> — Тормоз<br>
        • Стрелки <b>ВЛЕВО-ВПРАВО</b> / <b>A-D</b> — Поворот руля</p>
        <div class="start-text">КЛИКНИ В ЛЮБОЕ МЕСТО ДЛЯ СТАРТА</div>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let gameActive = false;
    let speed = 0;
    const maxSpeed = 300;
    let distance = 0;
    let playerX = 0; 
    let trackPosition = 0; 

    const segmentLength = 200;
    const rumblesPerSegment = 3;
    let segments = [];
    let trackLength = 0;

    function generateTrack() {
        segments = [];
        // Создаем зацикленный круг из 600 сегментов с разными поворотами
        for (let i = 0; i < 600; i++) {
            let curve = 0;
            if (i > 50 && i < 120) curve = 1.5;    
            if (i > 180 && i < 260) curve = -2.5;  
            if (i > 320 && i < 390) curve = 2; 
            if (i > 450 && i < 540) curve = -2;  

            segments.push({
                index: i,
                p1: { world: { z: i * segmentLength }, screen: { x: 0, y: 0, w: 0 } },
                p2: { world: { z: (i + 1) * segmentLength }, screen: { x: 0, y: 0, w: 0 } },
                curve: curve,
                color: Math.floor(i / rumblesPerSegment) % 2 ? { grass: '#10aa10', road: '#444', rumble: '#fff' } : { grass: '#008800', road: '#404040', rumble: '#ff3333' }
            });
        }
        trackLength = segments.length * segmentLength;
    }

    let keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function startGame() {
        document.getElementById("menu").style.display = "none";
        gameActive = true;
        speed = 0;
        distance = 0;
        trackPosition = 0;
        playerX = 0;
        generateTrack();
        gameLoop();
    }

    function project(point, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) {
        let transX = point.world.x - cameraX;
        let transY = point.world.y - cameraY;
        let transZ = point.world.z - cameraZ;
        let scale = cameraDepth / transZ;
        point.screen.x = Math.round((width / 2) + (scale * transX * width / 2));
        point.screen.y = Math.round((height / 2) - (scale * transY * height / 2));
        point.screen.w = Math.round(scale * roadWidth * width / 2);
    }

    function gameLoop() {
        if (!gameActive) return;

        if (keys['ArrowUp'] || keys['KeyW']) { speed += 2; } 
        else if (keys['ArrowDown'] || keys['KeyS']) { speed -= 5; } 
        else { speed -= 1; }

        if (speed > 0) {
            if (keys['ArrowLeft'] || keys['KeyA']) playerX -= 0.04 * (speed / maxSpeed);
            if (keys['ArrowRight'] || keys['KeyD']) playerX += 0.04 * (speed / maxSpeed);
        }

        speed = Math.max(0, Math.min(speed, maxSpeed));
        trackPosition += speed * 2;
        distance += Math.round(speed / 10);

        // Перемотка позиции в начало при завершении круга (магия бесконечности)
        if (trackPosition >= trackLength) {
            trackPosition -= trackLength;
        }

        document.getElementById("speed").innerText = Math.round(speed);
        document.getElementById("distance").innerText = distance;
        
        let speedSpan = document.getElementById("speed");
        if(speed > 200) { speedSpan.className = "hud-red"; } else { speedSpan.className = "hud-green"; }

        render();
        requestAnimationFrame(gameLoop);
    }

    function render() {
        ctx.fillStyle = "#74b9ff"; ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
        ctx.fillStyle = "#57606f"; ctx.fillRect(0, canvas.height / 2 - 40, canvas.width, 40);
        ctx.fillStyle = "#008800"; ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

        let width = canvas.width; let height = canvas.height;
        let roadWidth = 2000; let cameraDepth = 0.84;
        let playerSegment = Math.floor(trackPosition / segmentLength);
        let baseSegment = segments[playerSegment % segments.length];
        let dx = -baseSegment.curve * ( (trackPosition % segmentLength) / segmentLength );
        let currentX = 0;

        let maxy = height;
        for (let n = 0; n < 100; n++) {
            let segment = segments[(playerSegment + n) % segments.length];
            currentX += dx; dx += segment.curve;

            let camX = playerX * roadWidth - currentX;
            let camY = 1500;
            // Учитываем смещение координат при переходе на новый круг
            let camZ = trackPosition - (segment.index < playerSegment ? trackLength : 0);

            segment.p1.world.x = 0; segment.p1.world.y = 0;
            segment.p2.world.x = 0; segment.p2.world.y = 0;
            project(segment.p1, camX, camY, camZ, cameraDepth, width, height, roadWidth);
            project(segment.p2, camX, camY, camZ, cameraDepth, width, height, roadWidth);

            if (segment.p1.screen.y >= maxy || segment.p1.screen.y < height / 2) continue;

            let p1 = segment.p1.screen; let p2 = segment.p2.screen;

            ctx.fillStyle = segment.color.grass; ctx.fillRect(0, p2.y, width, p1.y - p2.y);

            let r1 = p1.w * 0.1; let r2 = p2.w * 0.1;
            ctx.fillStyle = segment.color.rumble;
            ctx.beginPath(); ctx.moveTo(p1.x - p1.w - r1, p1.y); ctx.lineTo(p1.x - p1.w, p1.y); ctx.lineTo(p2.x - p2.w, p2.y); ctx.lineTo(p2.x - p2.w - r2, p2.y); ctx.fill();
            ctx.beginPath(); ctx.moveTo(p1.x + p1.w + r1, p1.y); ctx.lineTo(p1.x + p1.w, p1.y); ctx.lineTo(p2.x + p2.w, p2.y); ctx.lineTo(p2.x + p2.w - r2, p2.y); ctx.fill();

            ctx.fillStyle = segment.color.road;
            ctx.beginPath(); ctx.moveTo(p1.x - p1.w, p1.y); ctx.lineTo(p1.x + p1.w, p1.y); ctx.lineTo(p2.x + p2.w, p2.y); ctx.lineTo(p2.x - p2.w, p2.y); ctx.fill();

            maxy = p1.y;
        }

        if (speed > 0) { playerX -= (speed / maxSpeed) * baseSegment.curve * 0.005; }

        ctx.save();
        let carWidth = 160; let carHeight = 70;
        let carX = width / 2 - carWidth / 2; let carY = height - 120;

        if (speed > 100) carY += Math.floor(Math.random() * 3) - 1;

        ctx.fillStyle = "#ff1e56"; ctx.fillRect(carX, carY, carWidth, carHeight);
        ctx.fillStyle = "#ffacb7"; ctx.fillRect(carX + 15, carY - 25, carWidth - 30, 25);
        ctx.fillStyle = "#111"; ctx.fillRect(carX + 25, carY - 20, carWidth - 50, 20);
        ctx.fillStyle = "#333"; ctx.fillRect(carX - 10, carY - 30, carWidth + 20, 10); ctx.fillRect(carX, carY - 20, 10, 20); ctx.fillRect(carX + carWidth - 10, carY - 20, 10, 20);
        ctx.fillStyle = "#1e1e24"; ctx.fillRect(carX - 5, carY + carHeight - 30, 25, 40); ctx.fillRect(carX + carWidth - 20, carY + carHeight - 30, 25, 40);
        ctx.fillStyle = speed > 0 && (keys['ArrowDown'] || keys['KeyS']) ? "#ff0000" : "#990000"; ctx.fillRect(carX + 10, carY + 10, 30, 12); ctx.fillRect(carX + carWidth - 40, carY + 10, 30, 12);
        ctx.restore();
    }
</script>

</body>
</html>
