<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Neon Stacker Mobile</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: #06060c; font-family: sans-serif; user-select: none; touch-action: none; color: #fff; }
        #game { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 10px; box-sizing: border-box; position: relative; }
        
        /* Панель со счётом и рекордом Лёвы */
        #score-board { width: 100%; display: flex; flex-direction: column; align-items: center; margin-top: 10px; margin-bottom: 5px; pointer-events: none; z-index: 10; }
        #record-view { font-size: 18px; font-weight: bold; color: #ffaa00; text-shadow: 0 0 10px rgba(255,170,0,0.5); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        #score { font-size: 28px; font-weight: bold; color: #00ffff; text-shadow: 0 0 15px rgba(0,255,255,0.5); }
        
        canvas { background: #0a0a14; border: 2px solid #333; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.6); max-width: 100%; max-height: 75vh; }
        #hint { position: absolute; bottom: 20px; font-size: 14px; color: #555; text-transform: uppercase; letter-spacing: 1px; pointer-events: none; }
        .overlay { display: none; position: absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .restart-btn { background: #00ffff; color: #000; border: none; padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 12px; margin-top: 20px; box-shadow: 0 0 15px #00ffff; }
    </style>
</head>
<body>

<div id="game">
    <div id="score-board">
        <!-- Твой рекорд намертво зашит в игру -->
        <div id="record-view">🏆 РЕКОРД ЛЁВЫ: <span id="high-score">31</span></div>
        <div id="score">БЛОКОВ: 0</div>
    </div>
    <canvas id="stackCanvas" width="360" height="480"></canvas>
    <div id="hint">Тапай в любое место экрана, чтобы поставить блок!</div>
</div>

<div id="game-over" class="overlay">
    <h1 style="color:#ff0055; text-shadow: 0 0 15px #ff0055;">БАШНЯ УПАЛА! 💥</h1>
    <p id="final-score" style="font-size:22px; color: #00ffff;"></p>
    <p id="record-alert" style="font-size:18px; color: #ffaa00; font-weight: bold; margin-top: 10px; display: none;">🔥 НОВЫЙ РЕКОРД ХАБА!</p>
    <button class="restart-btn" onclick="event.stopPropagation(); resetGame();">ЕЩЕ РАЗ</button>
</div>

<script>
    const canvas = document.getElementById("stackCanvas"), ctx = canvas.getContext("2d");
    let blocks = [], score = 0, gameActive = true, speed = 3, dir = 1;
    let highScore = 31; // Стартуем сразу со твоего крутого достижения!
    let currentBlock = { x: 50, w: 140, color: '#ff00ff' };
    let audioCtx = null;

    function playTone(f) {
        if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination); o.frequency.setValueAtTime(f, audioCtx.currentTime);
        g.gain.setValueAtTime(0.1, audioCtx.currentTime); o.start(); o.stop(audioCtx.currentTime + 0.08);
    }

    function initGame() {
        blocks = [{ x: 110, w: 140, color: '#00ffff' }];
        currentBlock = { x: 10, w: 140, color: '#ff00ff' };
        score = 0; gameActive = true; speed = 3; dir = 1;
        document.getElementById('score').innerText = "БЛОКОВ: 0";
        document.getElementById('game-over').style.display = 'none';
        document.getElementById('record-alert').style.display = 'none';
        document.getElementById('high-score').innerText = highScore;
    }

    window.addEventListener('touchstart', (e) => {
        if (!gameActive) return;
        e.preventDefault();

        let lastBlock = blocks[blocks.length - 1];
        let diff = currentBlock.x - lastBlock.x;

        // Погрешность умного магнита (7 пикселей)
        if (Math.abs(diff) <= 7) {
            diff = 0;
            currentBlock.x = lastBlock.x;
        }

        if (Math.abs(diff) >= lastBlock.w) {
            gameActive = false; playTone(150);
            
            // Проверяем, побит ли твой рекорд
            if (score > highScore) {
                highScore = score;
                document.getElementById('high-score').innerText = highScore;
                document.getElementById('record-alert').style.display = 'block';
            }

            document.getElementById('final-score').innerText = "Результат: " + score + " блоков";
            document.getElementById('game-over').style.display = 'flex';
            return;
        }

        let newW = lastBlock.w - Math.abs(diff);
        let newX = diff > 0 ? currentBlock.x : lastBlock.x;
        
        currentBlock.w = newW; 
        currentBlock.x = newX;

        blocks.push({ x: newX, w: newW, color: `hsl(${(score * 15) % 360}, 100%, 50%)` });
        score++; 
        document.getElementById('score').innerText = "БЛОКОВ: " + score;
        
        playTone(diff === 0 ? 650 + score * 5 : 300 + score * 15);
        if(score % 4 === 0) speed += 0.4;

        currentBlock = { x: 0, w: newW, color: '#fff' };
    });

    function update() {
        if(gameActive) {
            currentBlock.x += speed * dir;
            if(currentBlock.x + currentBlock.w > canvas.width || currentBlock.x < 0) dir *= -1;
        }

        ctx.clearRect(0,0,canvas.width,canvas.height);
        let offset = blocks.length > 7 ? (blocks.length - 7) * 40 : 0;

        for(let i=0; i<blocks.length; i++) {
            let b = blocks[i];
            ctx.fillStyle = b.color;
            ctx.fillRect(b.x, canvas.height - 40 - (i * 40) + offset, b.w, 35);
        }

        if(gameActive) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(currentBlock.x, canvas.height - 40 - (blocks.length * 40) + offset, currentBlock.w, 35);
        }

        requestAnimationFrame(update);
    }

    function resetGame() { initGame(); }

    initGame(); update();
</script>
</body>
</html>
